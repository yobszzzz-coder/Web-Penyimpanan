<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Penyimpanan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oxanium', sans-serif;
            /* Blokir seleksi teks di SEMUA elemen */
            user-select: none;
            -webkit-user-select: none;
        }
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --card-hover: #2a2a2a;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #ffffff;
            --danger: #ff4757;
            --border: #333333;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 80px 20px 80px;
        }

        /* Blokir seret, salin, tekan lama di SEMUA gambar */
        img {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none; /* Blokir semua interaksi tekan lama & klik di gambar */
        }

        .preview-img, .preview-video {
            pointer-events: auto; /* Pratinjau tetap bisa diklik tombol di sekitarnya */
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            margin-top: 10px;
            object-fit: cover;
            pointer-events: none; /* Tapi gambar tetap tidak bisa ditekan langsung */
        }

        .profile-container {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 100;
        }
        .profile-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin: 10px 0 30px;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background-color: var(--card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            /* Tombol tetap bisa diklik, tapi teks di dalamnya tidak bisa disalin */
            user-select: none;
            -webkit-user-select: none;
        }
        .tab-btn.active, .tab-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
            background-color: var(--card-hover);
        }
        .content-box {
            background-color: var(--card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            min-height: 400px;
            position: relative;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .file-item {
            background-color: var(--card-hover);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: 0.2s;
        }
        .file-item:hover {
            border-color: var(--accent);
        }
        .file-info {
            flex: 1;
            margin-right: 10px;
        }
        .file-info h3 {
            font-size: 0.95rem;
            margin-bottom: 5px;
            word-break: break-all;
        }
        .file-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-btn {
            width: 32px;
            height: 32px;
            padding: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            pointer-events: auto; /* Tombol tetap bisa diklik */
        }
        .action-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .action-btn:hover {
            transform: scale(1.15);
        }
        .add-btn {
            position: fixed;
            bottom: 90px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--accent);
            color: var(--bg);
            border: none;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(255,255,255,0.2);
            transition: transform 0.2s;
            z-index: 99;
        }
        .add-btn:hover {
            transform: scale(1.1);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0; visibility: hidden;
            transition: 0.3s;
        }
        .modal-overlay.show {
            opacity: 1; visibility: visible;
        }
        .modal-box {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
        }
        .modal-box h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            /* Hanya input yang BISA disalin/diedit teksnya */
            user-select: text;
            -webkit-user-select: text;
        }
        .modal-box input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn-cancel { background-color: var(--card-hover); color: var(--text); }
        .btn-confirm { background-color: var(--accent); color: var(--bg); }
        .btn-delete-confirm { background-color: var(--danger); color: white; }
        .hidden { display: none !important; }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            z-index: 50;
        }
        .custom-alert-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }
        .custom-alert-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .custom-alert-box {
            background-color: var(--card);
            border: 1px solid var(--danger);
            border-radius: 16px;
            padding: 25px;
            max-width: 380px;
            width: 90%;
            text-align: center;
        }
        .custom-alert-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .custom-alert-text {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            color: var(--text);
        }
        .custom-alert-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="IMG-20260812-WA0023.jpg" alt="Profil" class="profile-img">
    </div>

    <div class="container">
        <div class="header">
            <h1>Web Penyimpanan</h1>
            <p>Apa yang ingin kamu simpan?</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="files">Penyimpanan File/Dokumen</button>
            <button class="tab-btn" data-tab="media">Penyimpanan Foto/Video</button>
        </div>

        <div class="content-box">
            <div id="files-tab" class="tab-content">
                <div id="files-empty" class="empty-state">Belum ada file/dokumen yang disimpan</div>
                <div id="files-list" class="file-list"></div>
            </div>
            <div id="media-tab" class="tab-content hidden">
                <div id="media-empty" class="empty-state">Belum ada foto/video yang disimpan</div>
                <div id="media-list" class="file-list"></div>
            </div>
        </div>
        <button class="add-btn" id="addBtn">+</button>
    </div>

    <div class="custom-alert-overlay" id="customAlertOverlay">
        <div class="custom-alert-box">
            <div class="custom-alert-icon" id="alertIcon">⚠️</div>
            <div class="custom-alert-text" id="alertText"></div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">Mengerti</button>
        </div>
    </div>

    <footer>
        © 2026 Web Penyimpanan | Bisa Menyimpan Dokumen/File Rahasia & Foto/Vidio Okep elu🫪🫢
    </footer>

    <div class="modal-overlay" id="addFileModal">
        <div class="modal-box">
            <h2>Tambah File/Dokumen</h2>
            <input type="text" id="fileNameInput" placeholder="Masukkan Nama Package / Nama File">
            <input type="file" id="fileInput">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal('addFileModal')">Batal</button>
                <button class="modal-btn btn-confirm" onclick="validateAndSaveFile()">Simpan</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addMediaModal">
        <div class="modal-box">
            <h2>Tambah Foto / Video</h2>
            <input type="text" id="mediaNameInput" placeholder="Masukkan Nama Foto / Video">
            <input type="file" id="mediaInput" accept="image/*,video/mp4">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal('addMediaModal')">Batal</button>
                <button class="modal-btn btn-confirm" onclick="validateAndSaveMedia()">Simpan</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="deleteConfirmModal">
        <div class="modal-box">
            <h2>Apakah Anda yakin ingin menghapus?</h2>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal('deleteConfirmModal')">Batal</button>
                <button class="modal-btn btn-delete-confirm" id="confirmDeleteBtn">Hapus</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentTab = 'files';
        let pendingDelete = { type: '', key: null };
        let db;

        const ICONS = {
            download: 'IMG-20260825-WA0002.jpg',
            trash: 'https://cdn-icons-png.flaticon.com/512/3405/3405244.png'
        };

        const ALLOWED_FILE_EXTENSIONS = [
            '.zip', '.rar', '.7z', '.pdf', '.doc', '.docx', 
            '.xls', '.xlsx', '.ppt', '.pptx', '.txt', '.apk'
        ];
        const ALLOWED_MEDIA_EXTENSIONS = ['.jpg', '.jpeg', '.mp4'];

        function getFileExtension(filename) {
            return '.' + filename.split('.').pop().toLowerCase();
        }
        function isAllowedFile(filename) {
            return ALLOWED_FILE_EXTENSIONS.includes(getFileExtension(filename));
        }
        function isAllowedMedia(filename) {
            return ALLOWED_MEDIA_EXTENSIONS.includes(getFileExtension(filename));
        }

        function showCustomAlert(message, icon = '⚠️') {
            document.getElementById('alertText').innerHTML = message.replace(/\n/g, '<br>');
            document.getElementById('alertIcon').textContent = icon;
            document.getElementById('customAlertOverlay').classList.add('show');
        }
        function closeCustomAlert() {
            document.getElementById('customAlertOverlay').classList.remove('show');
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('WebPenyimpananDB', 1);
                req.onupgradeneeded = e => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) {
                        db.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('media')) {
                        db.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
                    }
                };
                req.onsuccess = e => { db = e.target.result; resolve(); };
                req.onerror = e => reject(e.target.error);
            });
        }
        function getAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e.target.error);
            });
        }
        function add(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                tx.objectStore(storeName).add(data);
                tx.oncomplete = resolve;
                tx.onerror = reject;
            });
        }
        function remove(storeName, id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                tx.objectStore(storeName).delete(id);
                tx.oncomplete = resolve;
                tx.onerror = reject;
            });
        }
        function downloadFile(item) {
            const link = document.createElement('a');
            link.href = item.data;
            link.download = item.name || 'file';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`${currentTab}-tab`).classList.remove('hidden');
                currentTab === 'files' ? renderFiles() : renderMedia();
            });
        });
        document.getElementById('addBtn').addEventListener('click', () => {
            currentTab === 'files' 
                ? document.getElementById('addFileModal').classList.add('show')
                : document.getElementById('addMediaModal').classList.add('show');
        });
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
            document.querySelectorAll('input[type="text"], input[type="file"]').forEach(el => el.value = '');
        }

        function validateAndSaveFile() {
            const name = document.getElementById('fileNameInput').value.trim();
            const file = document.getElementById('fileInput').files[0];
            if (!name || !file) {
                showCustomAlert('Isi nama dan pilih file terlebih dahulu!', '⚠️');
                return;
            }
            if (!isAllowedFile(file.name)) {
                showCustomAlert(
                    'Format file tidak diperbolehkan!\n\n' +
                    '✅ Boleh: ZIP, RAR, 7Z, PDF, DOC, DOCX, XLS, XLSX, PPT, PPTX, TXT, APK\n\n' +
                    '❌ Jangan masukkan foto/video di sini!',
                    '❌'
                );
                return;
            }
            saveFile(name, file);
        }
        async function saveFile(name, file) {
            const reader = new FileReader();
            reader.onload = async e => {
                await add('files', {
                    name, fileName: file.name, type: file.type,
                    size: file.size, data: e.target.result,
                    date: new Date().toLocaleString('id-ID')
                });
                renderFiles();
                closeModal('addFileModal');
            };
            reader.readAsDataURL(file);
        }
        async function renderFiles() {
            const files = await getAll('files');
            const list = document.getElementById('files-list');
            const empty = document.getElementById('files-empty');
            if (files.length === 0) {
                list.innerHTML = ''; empty.classList.remove('hidden'); return;
            }
            empty.classList.add('hidden'); list.innerHTML = '';
            files.forEach(item => {
                const el = document.createElement('div');
                el.className = 'file-item';
                el.innerHTML = `
                    <div class="file-info">
                        <h3>${item.name}</h3>
                        <p>${item.fileName}</p>
                        <p style="font-size:0.7rem">${(item.size/1024).toFixed(1)} KB • ${item.date}</p>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn" title="Download">
                            <img src="${ICONS.download}" alt="Download">
                        </button>
                        <button class="action-btn" title="Hapus">
                         <img src="${ICONS.trash}" alt="Hapus">
                    </button>
                `;
                btnDiv.querySelector('[title="Download"]').addEventListener('click', () => downloadFile(item));
                btnDiv.querySelector('[title="Hapus"]').addEventListener('click', () => askDelete('media', item.id));
                
                el.appendChild(infoDiv);
                el.appendChild(btnDiv);
                list.appendChild(el);
            });
        }

        function askDelete(type, key) {
            pendingDelete = { type, key };
            document.getElementById('deleteConfirmModal').classList.add('show');
        }
        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            await remove(pendingDelete.type, pendingDelete.key);
            closeModal('deleteConfirmModal');
            pendingDelete.type === 'files' ? renderFiles() : renderMedia();
            pendingDelete = { type: '', key: null };
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            renderFiles();
        });
    </script>
</body>
</html>
